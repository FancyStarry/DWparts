<!-- UDD302 -->
<article class="monster" id="UDD302" data-id="UDD302" data-name="玛丽奥内特"

         data-str="7" data-dex="14" data-con="9" data-int="9" data-wis="8" data-cha="13" data-hp="29" data-ac="8">

    <figure class="monster__portrait"><img src="img/characters/UDD302.webp" alt="玛丽奥内特"></figure>
    <div class="monster__title">
      <h2 class="monster__name">玛丽奥内特</h2>
      <p class="monster__meta"><span class="monster__level">3级</span><span class="monster__race">亡灵</span><span class="monster__dom"><img src="img/common/Dom.webp" class="ico" alt="支配">3</span></p>
    </div>
    <dl class="monster__abilities">
      <div class="ability"><dt>力量</dt><dd>7</dd></div>
      <div class="ability adv"><dt>敏捷</dt><dd>14</dd></div>
      <div class="ability"><dt>体质</dt><dd>9</dd></div>
      <div class="ability"><dt>智力</dt><dd>9</dd></div>
      <div class="ability"><dt>感知</dt><dd>8</dd></div>
      <div class="ability"><dt>魅力</dt><dd>13</dd></div>
    </dl>
    <dl class="monster__vitals">
      <div class="vital"><dt><img src="img/common/MHP.webp" class="ico" alt="">最大生命值</dt><dd>29</dd></div>
      <div class="vital"><dt><img src="img/common/AC.webp" class="ico" alt="">护甲等级（AC）</dt><dd>8</dd></div>
    </dl>
  </header>
  <ul class="parts">
    <li class="part" data-part="basic" data-act="main">
      <div class="part__head">
        <span class="badge">
          <img src="img/common/b.webp" class="badge__frame" alt="">
          <span class="badge__portrait" style="--badge-matte:url(img/common/mask-basic.png)"><img src="img/characters/UDD302.webp" alt=""></span>
          <img src="img/common/bt.webp" class="badge__label" alt="">
        </span>
        <h3 class="part__name">狂乱移动</h3>
        <p class="part__bonus"><span>免疫魅惑</span></p>
      </div>
      <div class="part__body">
        <p class="part__desc">击杀敌人时，立即恢复已消耗的<img src="img/common/main.webp" alt=""><span class="green">动作</span>。</p>
      </div>
    </li>
    <li class="part" data-part="m" data-act="main"
        data-bonus="dex" data-dmg="phy4" data-mult="dex"
        data-attack="melee"
        data-check="hit" data-hit="dex">
      <div class="part__head">
        <span class="badge">
          <img src="img/common/m.webp" class="badge__frame" alt="">
          <span class="badge__portrait" style="--badge-matte:url(img/common/mask-m.png)"><img src="img/characters/UDD302.webp" alt=""></span>
          <img src="img/common/mt.webp" class="badge__label" alt="">
        </span>
        <h3 class="part__name">狂乱打击</h3>
        <p class="part__bonus"><span>敏捷+1</span></p>
      </div>
      <div class="part__body">
        <div class="dmg">
          <span class="dmg__die"><img src="img/common/dice.webp" alt=""></span>
          <span class="dmg__lines">
            <span class="dmg__line phy4">2d10 <img class="ico" src="img/common/phy4.webp" alt="">物理伤害<img class="ico" src="img/common/DEX.webp" alt="敏捷" title="敏捷"></span>
          </span>
        </div>
        <p class="part__desc">强力斩击目标。</p>
      </div>
    </li>
    <li class="part" data-part="s1" data-act="passive"
        data-bonus="ini">
      <div class="part__head">
        <span class="badge">
          <img src="img/common/s1.webp" class="badge__frame" alt="">
          <span class="badge__portrait" style="--badge-matte:url(img/common/mask-s1.png)"><img src="img/characters/UDD302.webp" alt=""></span>
          <img src="img/common/s1t.webp" class="badge__label" alt="">
        </span>
        <h3 class="part__name">杂技演员之线</h3>
        <p class="part__bonus"><span>先攻+2</span></p>
      </div>
      <div class="part__body">
        <p class="part__desc">在<span class="blue">敏捷豁免</span>上获得<span class="blue">优势</span>。</p>
      </div>
    </li>
    <li class="part" data-part="s2" data-act="react"
        data-bonus="cha">
      <div class="part__head">
        <span class="badge">
          <img src="img/common/s2.webp" class="badge__frame" alt="">
          <span class="badge__portrait" style="--badge-matte:url(img/common/mask-s2.png)"><img src="img/characters/UDD302.webp" alt=""></span>
          <img src="img/common/s2t.webp" class="badge__label" alt="">
        </span>
        <h3 class="part__name">嘲弄之线</h3>
        <p class="part__bonus"><span>魅力+1</span></p>
      </div>
      <div class="part__body">
        <p class="part__desc">躲避敌人攻击时作为反应，立即恢复已消耗的<img src="img/common/main.webp" alt=""><span class="green">动作</span>。</p>
      </div>
    </li>
  </ul>
</article>
